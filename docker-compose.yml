services:
  coldchain:
    build: .
    image: nimbus-coldchain:local
    container_name: nimbus-coldchain
    ports:
      - "8000:8000"
    environment:
      COLDCHAIN_DB: /app/state/coldchain.db
      COLDCHAIN_DATASET: /app/data/sensor_readings.json
      COLDCHAIN_SEED_DEMO: "true"
      COLDCHAIN_DEMO_MODE: "true"
      # COLDCHAIN_THRESHOLD_C: "8.0"
      # COLDCHAIN_MIN_DURATION_MIN: "20"
      # COLDCHAIN_MAX_GAP_MIN: "15"
      # COLDCHAIN_WEBHOOK_URL: "https://hooks.slack.com/services/..."
    volumes:
      - coldchain-state:/app/state
    restart: unless-stopped

volumes:
  coldchain-state:
